name: Deploy dashboard naar GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo uitchecken
        uses: actions/checkout@v4

      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Site-map uploaden als artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deployen naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
